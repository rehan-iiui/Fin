<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>FinanceFlow</title>

<style>
:root{
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --text:#172033;
  --muted:#697386;
  --border:#e5e9f0;
  --primary:#635bff;
  --primary2:#8b5cf6;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --shadow:0 12px 35px rgba(15,23,42,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  transition:.25s;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 10px 24px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:white;
  font-size:21px;
  font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 20px rgba(99,91,255,.28);
}

.brand h1{
  font-size:19px;
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.nav{
  display:grid;
  gap:6px;
}

.nav button{
  width:100%;
  padding:12px 13px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  border-radius:13px;
  transition:.2s;
}

.nav button:hover{
  background:var(--surface2);
  color:var(--text);
}

.nav button.active{
  background:linear-gradient(135deg,rgba(99,91,255,.13),rgba(139,92,246,.08));
  color:var(--primary);
  font-weight:700;
}

.side-profile{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  display:grid;
  place-items:center;
  font-weight:800;
  overflow:hidden;
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.side-profile-text{
  min-width:0;
}

.side-profile-text strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.side-profile-text span{
  color:var(--muted);
  font-size:11px;
}

/* MAIN */
.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-width:0;
}

.topbar{
  height:74px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.mobile-menu{
  display:none;
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--surface2);
}

.page-title{
  font-size:20px;
  font-weight:800;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--surface2);
  color:var(--text);
}

.profile-top{
  display:flex;
  align-items:center;
  gap:9px;
  padding:5px 9px 5px 5px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
}

.profile-top .avatar{
  width:32px;
  height:32px;
}

.profile-top span{
  font-size:13px;
  font-weight:700;
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* CARDS */
.grid{
  display:grid;
  gap:18px;
}

.stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.stat-card{
  min-height:135px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.stat-value{
  font-size:27px;
  font-weight:850;
  margin-top:13px;
  letter-spacing:-.7px;
}

.stat-sub{
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
}

.green{color:var(--green)!important}
.red{color:var(--red)!important}
.orange{color:var(--orange)!important}
.primary{color:var(--primary)!important}

.section{
  margin-top:20px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:14px;
}

.section-head h2{
  font-size:18px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.two{
  grid-template-columns:1.45fr 1fr;
}

.three{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

/* CHART */
.chart{
  height:230px;
  display:flex;
  align-items:end;
  gap:10px;
  padding-top:25px;
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:end;
  align-items:center;
  gap:8px;
}

.bar{
  width:min(45px,80%);
  min-height:4px;
  border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg,var(--primary),var(--primary2));
  transition:.3s;
}

.bar:hover{
  transform:translateY(-5px);
}

.bar-label{
  font-size:10px;
  color:var(--muted);
}

/* BUTTONS */
.btn{
  padding:10px 14px;
  border-radius:12px;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  font-weight:700;
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#cdd3df;
}

.btn.primary-btn{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  border:0;
}

.btn.danger{
  color:var(--red);
}

.btn.success{
  color:var(--green);
}

.btn.small{
  padding:7px 10px;
  font-size:12px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* TABLE */
.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  background:rgba(99,91,255,.1);
  color:var(--primary);
  border-radius:999px;
  font-size:10px;
  margin:2px;
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.field{
  display:grid;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

.field input,
.field select{
  width:100%;
  padding:12px 13px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.1);
}

/* PROFILE */
.profile-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:20px;
}

.profile-card{
  text-align:center;
}

.profile-big-avatar{
  width:120px;
  height:120px;
  margin:5px auto 16px;
  border-radius:50%;
  font-size:35px;
}

.camera-buttons{
  display:grid;
  gap:8px;
  margin-top:15px;
}

.profile-name{
  font-size:20px;
  font-weight:800;
}

.profile-email{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  word-break:break-word;
}

/* PROGRESS */
.progress{
  width:100%;
  height:10px;
  background:var(--surface2);
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--border);
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  border-radius:inherit;
  transition:.3s;
}

/* FORECAST */
.forecast-number{
  font-size:34px;
  font-weight:850;
  margin:12px 0;
}

.forecast-box{
  padding:15px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:15px;
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.forecast-row:last-child{
  border-bottom:0;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:34px;
  margin-bottom:8px;
}

/* TOAST */
.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:200;
  display:grid;
  gap:9px;
  width:min(360px,calc(100vw - 40px));
}

.toast{
  background:#111827;
  color:white;
  border-radius:14px;
  padding:13px 15px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  animation:toastIn .25s ease;
  font-size:13px;
}

.toast.error{
  border-left:4px solid #ef4444;
}

.toast.success{
  border-left:4px solid #22c55e;
}

@keyframes toastIn{
  from{transform:translateY(15px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.62);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--surface2);
}

/* CAMERA */
.camera-preview{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  background:#080b12;
  border-radius:17px;
  display:block;
}

.camera-note{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

/* LOCK */
.lock-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#101426,#1d2340);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:white;
}

.lock-screen.show{
  display:flex;
}

.lock-box{
  width:min(390px,100%);
  text-align:center;
}

.lock-avatar{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:800;
  overflow:hidden;
}

.lock-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.lock-box h2{
  font-size:25px;
}

.lock-box p{
  color:#b8c0d4;
  font-size:13px;
  margin:7px 0 20px;
}

.pin-input{
  width:100%;
  padding:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:13px;
  text-align:center;
  font-size:22px;
  letter-spacing:8px;
  outline:none;
}

.pin-input::placeholder{
  letter-spacing:2px;
  color:#9ba5bb;
}

/* OVERLAY */
.mobile-overlay{
  display:none;
}

/* DARK MODE */
body.dark{
  --bg:#0b1020;
  --surface:#111827;
  --surface2:#182235;
  --text:#eef2ff;
  --muted:#9aa6bc;
  --border:#263247;
  --shadow:0 15px 40px rgba(0,0,0,.2);
}

body.dark .topbar{
  background:rgba(17,24,39,.9);
}

/* RESPONSIVE */
@media(max-width:1050px){
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .two{
    grid-template-columns:1fr;
  }

  .profile-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    box-shadow:20px 0 50px rgba(0,0,0,.15);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .mobile-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.45);
    z-index:40;
  }

  .mobile-overlay.show{
    display:block;
  }

  .content{
    padding:18px;
  }

  .topbar{
    padding:0 15px;
  }

  .profile-top span{
    display:none;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .three{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">₣</div>
      <div>
        <h1>FinanceFlow</h1>
        <span>Smart money dashboard</span>
      </div>
    </div>

    <nav class="nav">
      <button data-page="dashboard">🏠 Dashboard</button>
      <button data-page="transactions">💳 Transactions</button>
      <button data-page="budget">🎯 Budget</button>
      <button data-page="calendar">📅 Calendar</button>
      <button data-page="bills">🧾 Bills</button>
      <button data-page="savings">💰 Savings</button>
      <button data-page="recurring">🔁 Recurring</button>
      <button data-page="forecast">📈 Cash Flow</button>
      <button data-page="reports">📊 Reports</button>
      <button data-page="about">ℹ️ About</button>
      <button data-page="profile">👤 Profile</button>
    </nav>

    <div class="side-profile">
      <div class="avatar" id="sideAvatar"></div>
      <div class="side-profile-text">
        <strong id="sideName">User</strong>
        <span id="sideEmail">Profile</span>
      </div>
    </div>
  </aside>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" id="menuBtn">☰</button>
        <div class="page-title" id="pageTitle">Dashboard</div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>

        <button class="profile-top" id="profileTopBtn">
          <div class="avatar" id="topAvatar"></div>
          <span id="topName">User</span>
        </button>
      </div>
    </header>

    <div class="content" id="content"></div>

  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- CAMERA MODAL -->
<div class="modal" id="cameraModal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h2>Take Profile Photo</h2>
        <div class="muted">Allow camera access to capture your photo.</div>
      </div>
      <button class="close" id="closeCamera">✕</button>
    </div>

    <video id="cameraVideo" class="camera-preview" autoplay playsinline muted></video>

    <div class="camera-note">
      If camera access is blocked by your browser or preview environment,
      use <b>Choose Photo</b> from your profile instead.
    </div>

    <div class="actions" style="margin-top:15px">
      <button class="btn primary-btn" id="captureBtn">📸 Capture Photo</button>
      <button class="btn" id="stopCameraBtn">Stop Camera</button>
    </div>

    <canvas id="cameraCanvas" hidden></canvas>
  </div>
</div>

<!-- PIN LOCK -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">

    <div class="lock-avatar" id="lockAvatar"></div>

    <h2 id="lockName">FinanceFlow</h2>
    <p>Enter your 4-digit PIN to continue.</p>

    <input
      class="pin-input"
      id="unlockPin"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <button class="btn primary-btn" id="unlockBtn" style="width:100%;margin-top:12px">
      Unlock FinanceFlow
    </button>

    <div id="unlockError" style="color:#fca5a5;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>

<script>
"use strict";

/* =========================================================
   FINANCEFLOW
   Standalone version with reliable local persistence
   ========================================================= */

const STORAGE_KEY = "financeflow_standalone_v1";
const OLD_KEYS = [
  "financeflow_v6",
  "financeflow_v5",
  "financeflow_v4",
  "financeflow"
];

const $ = id => document.getElementById(id);

const DEFAULT_STATE = {
  transactions: [],
  budgets: {},
  bills: [],
  recurring: [],
  goal: {
    name: "My Savings Goal",
    target: 100000,
    current: 0
  },
  profile: {
    name: "User",
    email: "",
    currency: "Rs",
    monthlyTarget: 0,
    photo: "",
    joined: new Date().toISOString()
  },
  security: {
    pinEnabled: false,
    pinHash: ""
  },
  dark: false,
  lastPage: "dashboard"
};

let state = loadState();
let cameraStream = null;
let currentPage = state.lastPage || "dashboard";

/* =========================================================
   STATE / STORAGE
   ========================================================= */

function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function mergeState(saved){
  const result = deepClone(DEFAULT_STATE);

  if(!saved || typeof saved !== "object"){
    return result;
  }

  Object.assign(result, saved);

  result.profile = {
    ...DEFAULT_STATE.profile,
    ...(saved.profile || {})
  };

  result.security = {
    ...DEFAULT_STATE.security,
    ...(saved.security || {})
  };

  result.goal = {
    ...DEFAULT_STATE.goal,
    ...(saved.goal || {})
  };

  result.transactions = Array.isArray(saved.transactions)
    ? saved.transactions
    : [];

  result.budgets = saved.budgets && typeof saved.budgets === "object"
    ? saved.budgets
    : {};

  result.bills = Array.isArray(saved.bills)
    ? saved.bills
    : [];

  result.recurring = Array.isArray(saved.recurring)
    ? saved.recurring
    : [];

  result.transactions = result.transactions.map(t => ({
    id: t.id || uid(),
    title: t.title || "Transaction",
    type: t.type === "income" ? "income" : "expense",
    amount: Number(t.amount) || 0,
    category: t.category || "Other",
    date: t.date || today(),
    tags: Array.isArray(t.tags) ? t.tags : [],
    createdAt: t.createdAt || new Date().toISOString()
  }));

  return result;
}

function loadState(){
  let raw = null;

  try{
    raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      for(const key of OLD_KEYS){
        const old = localStorage.getItem(key);
        if(old){
          raw = old;
          break;
        }
      }
    }

    if(raw){
      return mergeState(JSON.parse(raw));
    }
  }catch(error){
    console.error("FinanceFlow load error:", error);
  }

  return deepClone(DEFAULT_STATE);
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    /* Verify the write */
    const check = localStorage.getItem(STORAGE_KEY);

    if(!check){
      throw new Error("Storage verification failed.");
    }

    return true;
  }catch(error){
    console.error("FinanceFlow save error:", error);

    toast(
      "FinanceFlow could not save data. Browser storage may be blocked or full.",
      "error"
    );

    return false;
  }
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function today(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function money(amount){
  const currency = state.profile.currency || "Rs";

  try{
    return `${currency} ${Number(amount || 0).toLocaleString(undefined,{
      maximumFractionDigits:2
    })}`;
  }catch{
    return `${currency} ${Number(amount || 0).toFixed(2)}`;
  }
}

function toast(message,type="success"){
  const container = $("toastContainer");

  const item = document.createElement("div");
  item.className = `toast ${type}`;
  item.textContent = message;

  container.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },3500);
}

/* =========================================================
   AVATARS
   ========================================================= */

function initials(name){
  const clean = String(name || "User").trim();

  if(!clean) return "U";

  return clean
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function renderAvatar(element,large=false){
  if(!element) return;

  element.innerHTML = "";

  if(state.profile.photo){
    const img = document.createElement("img");
    img.src = state.profile.photo;
    img.alt = "Profile photo";
    element.appendChild(img);
  }else{
    element.textContent = initials(state.profile.name);
  }

  if(large){
    element.classList.add("profile-big-avatar");
  }
}

function updateProfileUI(){
  $("sideName").textContent = state.profile.name || "User";
  $("sideEmail").textContent = state.profile.email || "Profile";
  $("topName").textContent = state.profile.name || "User";

  renderAvatar($("sideAvatar"));
  renderAvatar($("topAvatar"));
  renderAvatar($("lockAvatar"));
}

/* =========================================================
   NAVIGATION
   ========================================================= */

const pageNames = {
  dashboard:"Dashboard",
  transactions:"Transactions",
  budget:"Budget",
  calendar:"Calendar",
  bills:"Bills",
  savings:"Savings",
  recurring:"Recurring Transactions",
  forecast:"Cash Flow Forecast",
  reports:"Reports",
  about:"About FinanceFlow",
  profile:"Profile"
};

function navigate(page){
  if(!pageNames[page]){
    page = "dashboard";
  }

  currentPage = page;
  state.lastPage = page;
  saveState();

  $("pageTitle").textContent = pageNames[page];

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page === page);
  });

  renderPage();

  closeSidebar();
}

function renderPage(){
  const content = $("content");

  if(currentPage === "dashboard") renderDashboard(content);
  else if(currentPage === "transactions") renderTransactions(content);
  else if(currentPage === "budget") renderBudget(content);
  else if(currentPage === "calendar") renderCalendar(content);
  else if(currentPage === "bills") renderBills(content);
  else if(currentPage === "savings") renderSavings(content);
  else if(currentPage === "recurring") renderRecurring(content);
  else if(currentPage === "forecast") renderForecast(content);
  else if(currentPage === "reports") renderReports(content);
  else if(currentPage === "about") renderAbout(content);
  else if(currentPage === "profile") renderProfile(content);
}

/* =========================================================
   CALCULATIONS
   ========================================================= */

function totals(){
  let income = 0;
  let expenses = 0;

  state.transactions.forEach(t=>{
    if(t.type === "income") income += Number(t.amount) || 0;
    else expenses += Number(t.amount) || 0;
  });

  return {
    income,
    expenses,
    balance: income - expenses,
    savings: income - expenses
  };
}

function categoryTotals(){
  const result = {};

  state.transactions
    .filter(t=>t.type === "expense")
    .forEach(t=>{
      result[t.category] = (result[t.category] || 0) + Number(t.amount);
    });

  return result;
}

function renderDashboardChart(){
  const container = $("dashboardChart");

  if(!container) return;

  const months = [];

  for(let i=5;i>=0;i--){
    const d = new Date();
    d.setMonth(d.getMonth()-i);

    months.push({
      label:d.toLocaleString(undefined,{month:"short"}),
      year:d.getFullYear(),
      month:d.getMonth(),
      income:0,
      expense:0
    });
  }

  state.transactions.forEach(t=>{
    const d = new Date(t.date + "T00:00:00");

    const found = months.find(m =>
      m.year === d.getFullYear() &&
      m.month === d.getMonth()
    );

    if(found){
      if(t.type === "income") found.income += Number(t.amount);
      else found.expense += Number(t.amount);
    }
  });

  const max = Math.max(
    1,
    ...months.flatMap(m=>[m.income,m.expense])
  );

  container.innerHTML = months.map(m=>{
    const height = Math.max(4,(m.income/max)*100);
    const expenseHeight = Math.max(4,(m.expense/max)*100);

    return `
      <div class="bar-wrap" title="Income: ${money(m.income)} | Expenses: ${money(m.expense)}">
        <div style="height:${height}%;width:45%;background:linear-gradient(180deg,#16a34a,#4ade80);border-radius:7px 7px 2px 2px"></div>
        <div style="height:${expenseHeight}%;width:45%;background:linear-gradient(180deg,#ef4444,#fb7185);border-radius:7px 7px 2px 2px"></div>
        <div class="bar-label">${m.label}</div>
      </div>
    `;
  }).join("");
}

function renderTransactionList(){
  const container = $("transactionList");
  if(!container) return;

  const search = ($("transactionSearch")?.value || "").toLowerCase();
  const filter = $("transactionFilter")?.value || "all";

  let list = [...state.transactions]
    .filter(t=>filter==="all" || t.type===filter)
    .filter(t=>{
      const text = [
        t.title,
        t.category,
        t.date,
        ...(t.tags || [])
      ].join(" ").toLowerCase();

      return text.includes(search);
    })
    .sort((a,b)=>b.date.localeCompare(a.date));

  if(!list.length){
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔎</div>
        No matching transactions.
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th>Type</th>
            <th>Category</th>
            <th>Tags</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(t=>`
            <tr>
              <td><strong>${escapeHtml(t.title)}</strong></td>
              <td>${t.type==="income"?"🟢 Income":"🔴 Expense"}</td>
              <td>${escapeHtml(t.category)}</td>
              <td>
                ${(t.tags||[]).map(tag=>`
                  <span class="tag">${escapeHtml(tag)}</span>
                `).join("")}
              </td>
              <td>${escapeHtml(t.date)}</td>
              <td class="${t.type==="income"?"green":"red"}">
                ${t.type==="income"?"+":"−"}${money(t.amount)}
              </td>
              <td>
                <div class="actions">
                  <button class="btn small" data-edit="${t.id}">Edit</button>
                  <button class="btn small danger" data-delete="${t.id}">Delete</button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  container.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick = ()=>{
      state.transactions = state.transactions.filter(
        t=>t.id !== btn.dataset.delete
      );

      saveState();
      renderTransactionList();
      toast("Transaction deleted.");
    };
  });

  container.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = ()=>{
      const transaction = state.transactions.find(
        t=>t.id === btn.dataset.edit
      );

      if(transaction) openTransactionForm(transaction.type,transaction);
    };
  });
}

function openTransactionForm(type,existing=null){
  const modal = createModal(
    existing ? "Edit Transaction" : `Add ${type==="income"?"Income":"Expense"}`,
    `
      <div class="form-grid">

        <div class="field full">
          <label>Description</label>
          <input id="txTitle" value="${escapeAttr(existing?.title || "")}" placeholder="e.g. Grocery shopping">
        </div>

        <div class="field">
          <label>Amount</label>
          <input id="txAmount" type="number" min="0" step="0.01" value="${existing?.amount || ""}">
        </div>

        <div class="field">
          <label>Category</label>
          <select id="txCategory">
            ${["Food","Transport","Shopping","Bills","Entertainment","Other"]
              .map(c=>`<option ${existing?.category===c?"selected":""}>${c}</option>`)
              .join("")}
          </select>
        </div>

        <div class="field">
          <label>Date</label>
          <input id="txDate" type="date" value="${existing?.date || today()}">
        </div>

        <div class="field">
          <label>Tags</label>
          <input id="txTags" value="${escapeAttr((existing?.tags||[]).join(", "))}" placeholder="home, important">
        </div>

      </div>

      <div class="actions" style="margin-top:18px">
        <button class="btn primary-btn" id="saveTxBtn">
          ${existing?"Save Changes":"Add Transaction"}
        </button>
      </div>
    `
  );

  modal.querySelector("#saveTxBtn").onclick = ()=>{
    const title = modal.querySelector("#txTitle").value.trim();
    const amount = Number(modal.querySelector("#txAmount").value);
    const category = modal.querySelector("#txCategory").value;
    const date = modal.querySelector("#txDate").value;
    const tags = modal.querySelector("#txTags").value
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);

    if(!title || !amount || amount < 0 || !date){
      toast("Please complete the transaction details.","error");
      return;
    }

    if(existing){
      Object.assign(existing,{
        title,
        amount,
        category,
        date,
        tags
      });
    }else{
      state.transactions.push({
        id:uid(),
        title,
        type,
        amount,
        category,
        date,
        tags,
        createdAt:new Date().toISOString()
      });
    }

    saveState();
    modal.remove();
    renderPage();
    toast(existing?"Transaction updated.":"Transaction added.");
  };
}

function recurringMonthlyAmount(r){
  const amount = Number(r.amount)||0;

  if(r.frequency==="daily") return amount*30.4375;
  if(r.frequency==="weekly") return amount*4.345;
  if(r.frequency==="yearly") return amount/12;

  return amount;
}

function processRecurring(){
  let changed = false;
  const todayStr = today();

  state.recurring.forEach(r=>{
    if(!r.active || !r.nextDate) return;

    let safety = 0;

    while(r.nextDate <= todayStr && safety < 24){
      state.transactions.push({
        id:uid(),
        title:r.title,
        type:r.type,
        amount:Number(r.amount)||0,
        category:r.category || "Other",
        date:r.nextDate,
        tags:[...(r.tags||[]),"recurring"],
        createdAt:new Date().toISOString()
      });

      r.nextDate = addFrequency(r.nextDate,r.frequency);
      changed = true;
      safety++;
    }
  });

  if(changed){
    saveState();
  }
}

function addFrequency(dateStr,frequency){
  const d = new Date(dateStr + "T00:00:00");

  if(frequency==="daily"){
    d.setDate(d.getDate()+1);
  }

  else if(frequency==="weekly"){
    d.setDate(d.getDate()+7);
  }

  else if(frequency==="monthly"){
    const day = d.getDate();

    d.setDate(1);
    d.setMonth(d.getMonth()+1);

    const last = new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    ).getDate();

    d.setDate(Math.min(day,last));
  }

  else if(frequency==="yearly"){
    const month = d.getMonth();
    const day = d.getDate();

    d.setDate(1);
    d.setFullYear(d.getFullYear()+1);
    d.setMonth(month);

    const last = new Date(
      d.getFullYear(),
      month+1,
      0
    ).getDate();

    d.setDate(Math.min(day,last));
  }

  return formatDate(d);
}

function formatDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* =========================================================
   CASH FLOW FORECAST
   ========================================================= */

function getForecast(){
  const t = totals();

  const start = new Date();
  start.setHours(0,0,0,0);

  const end = new Date(start);
  end.setDate(end.getDate()+30);

  let recurringIncome = 0;
  let recurringExpense = 0;

  const upcoming = [];

  state.recurring
    .filter(r=>r.active)
    .forEach(r=>{
      let date = new Date(r.nextDate + "T00:00:00");
      let guard = 0;

      while(date <= end && guard < 60){
        if(date >= start){
          if(r.type==="income"){
            recurringIncome += Number(r.amount)||0;
          }else{
            recurringExpense += Number(r.amount)||0;
          }

          upcoming.push({
            date:formatDate(date),
            title:r.title,
            type:r.type,
            amount:Number(r.amount)||0,
            source:"Recurring"
          });
        }

        date = new Date(addFrequency(formatDate(date),r.frequency)+"T00:00:00");
        guard++;
      }
    });

  let bills = 0;

  state.bills
    .filter(b=>!b.paid)
    .forEach(b=>{
      const d = new Date(b.date+"T00:00:00");

      if(d>=start && d<=end){
        bills += Number(b.amount)||0;

        upcoming.push({
          date:b.date,
          title:b.title,
          type:"expense",
          amount:Number(b.amount)||0,
          source:"Bill"
        });
      }
    });

  const projected = t.balance + recurringIncome - recurringExpense - bills;

  upcoming.sort((a,b)=>a.date.localeCompare(b.date));

  return {
    balance:t.balance,
    recurringIncome,
    recurringExpense,
    bills,
    projected,
    upcoming
  };
}

function renderCalendar(el){

  const last = new Date(year,month+1,0);

  const cells = [];

  for(let i=0;i<first.getDay();i++){

    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        ${billCount?`<div style="font-size:11px;color:var(--red);margin-top:3px">🧾 ${billCount} bill(s)</div>`:""}

  el.innerHTML = `

function exportCSV(){
  const rows = [
    ["Description","Type","Amount","Category","Date","Tags"]
  ];

  state.transactions.forEach(t=>{
    rows.push([
      t.title,
      t.type,
      t.amount,
      t.category,
      t.date,
      (t.tags||[]).join("|")
    ]);
  });

  const csv = rows.map(row =>
    row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")
  ).join("\n");

  downloadFile(
    csv,
    "financeflow-transactions.csv",
    "text/csv"
  );

  toast("CSV exported.");
}

function backupJSON(){
  downloadFile(
    JSON.stringify(state,null,2),
    "financeflow-backup.json",
    "application/json"
  );

  toast("Backup created.");
}

function downloadFile(content,name,type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

        <div>

function saveProfile(){
  const name = $("profileName").value.trim();
  const email = $("profileEmail").value.trim();
  const currency = $("profileCurrency").value;
  const monthlyTarget = Number($("profileTarget").value)||0;

  state.profile.name = name || "User";
  state.profile.email = email;
  state.profile.currency = currency;
  state.profile.monthlyTarget = monthlyTarget;

  const saved = saveState();

  if(saved){
    updateProfileUI();
    toast("Profile saved successfully.");
  }
}

function removePhoto(){
  state.profile.photo = "";
  saveState();
  renderPage();
  updateProfileUI();
  toast("Profile photo removed.");
}

/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast(
      "Camera is not supported here. Use Choose Photo instead.",
      "error"
    );
    return;
  }

  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user"
      },
      audio:false
    });

    const video = $("cameraVideo");

    video.srcObject = cameraStream;

    $("cameraModal").classList.add("show");

    try{
      await video.play();
    }catch(error){
      console.warn("Video play error:",error);
    }

  }catch(error){
    console.error("Camera error:",error);

    let message =
      "Camera access was not granted. Use Choose Photo instead.";

    if(error.name === "NotAllowedError"){
      message =
        "Camera access is blocked here. Open FinanceFlow on a normal HTTPS page and allow camera permission.";
    }

    if(error.name === "NotFoundError"){
      message =
        "No camera was found on this device. Use Choose Photo instead.";
    }

    toast(message,"error");
  }
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>{
      try{
        track.stop();
      }catch{}
    });

    cameraStream = null;
  }

  const video = $("cameraVideo");

  if(video){
    video.srcObject = null;
  }
}

function closeCamera(){
  stopCamera();
  $("cameraModal").classList.remove("show");
}

function capturePhoto(){
  const video = $("cameraVideo");
  const canvas = $("cameraCanvas");

  if(!video.videoWidth || !video.videoHeight){
    toast("Camera is not ready yet.","error");
    return;
  }

  const maxWidth = 700;
  const scale = Math.min(1,maxWidth/video.videoWidth);

  canvas.width = Math.round(video.videoWidth*scale);
  canvas.height = Math.round(video.videoHeight*scale);

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  try{
    state.profile.photo = canvas.toDataURL("image/jpeg",.82);

    if(saveState()){
      closeCamera();
      renderPage();
      updateProfileUI();
      toast("Profile photo saved.");
    }

  }catch(error){
    console.error("Photo save error:",error);

    toast(
      "The photo could not be saved. Browser storage may be full.",
      "error"
    );
  }
}

/* =========================================================
   PHOTO UPLOAD
   ========================================================= */

$("photoInput").addEventListener("change",function(){
  const file = this.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    toast("Please choose an image file.","error");
    return;
  }

  const reader = new FileReader();

  reader.onload = ()=>{
    const img = new Image();

    img.onload = ()=>{
      const canvas = document.createElement("canvas");

      const max = 700;
      const scale = Math.min(1,max/img.width);

      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      try{
        state.profile.photo = canvas.toDataURL("image/jpeg",.82);

        if(saveState()){
          renderPage();
          updateProfileUI();
          toast("Profile photo saved.");
        }

      }catch(error){
        console.error(error);
        toast("Photo could not be saved.","error");
      }
    };

    img.onerror = ()=>{
      toast("Could not read that image.","error");
    };

    img.src = reader.result;
  };

  reader.onerror = ()=>{
    toast("Could not read the selected photo.","error");
  };

  reader.readAsDataURL(file);

  this.value = "";
});

/* =========================================================
   PIN SECURITY
   ========================================================= */

async function hashPin(pin){
  const data = new TextEncoder().encode(pin);

  const hash = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return [...new Uint8Array(hash)]
    .map(byte=>byte.toString(16).padStart(2,"0"))
    .join("");
}

function validPin(pin){
  return /^\d{4}$/.test(pin);
}

async function setupPin(){
  const pin = promptSafe("Create a 4-digit PIN:");

  if(pin === null) return;

  if(!validPin(pin)){
    toast("PIN must contain exactly 4 digits.","error");
    return;
  }

  const confirmPin = promptSafe("Enter the PIN again:");

  if(confirmPin !== pin){
    toast("PIN confirmation did not match.","error");
    return;
  }

  state.security.pinHash = await hashPin(pin);
  state.security.pinEnabled = true;

  saveState();
  renderPage();

  toast("PIN protection enabled.");
}

async function changePin(){
  const current = promptSafe("Enter your current PIN:");

  if(current === null) return;

  const currentHash = await hashPin(current);

  if(currentHash !== state.security.pinHash){
    toast("Current PIN is incorrect.","error");
    return;
  }

  const next = promptSafe("Enter your new 4-digit PIN:");

  if(next === null) return;

  if(!validPin(next)){
    toast("PIN must contain exactly 4 digits.","error");
    return;
  }

  const confirmNext = promptSafe("Enter the new PIN again:");

  if(confirmNext !== next){
    toast("PIN confirmation did not match.","error");
    return;
  }

  state.security.pinHash = await hashPin(next);
  state.security.pinEnabled = true;

  saveState();
  renderPage();

  toast("PIN changed successfully.");
}

async function disablePin(){
  const current = promptSafe("Enter your current PIN:");

  if(current === null) return;

  const hash = await hashPin(current);

  if(hash !== state.security.pinHash){
    toast("Current PIN is incorrect.","error");
    return;
  }

  state.security.pinEnabled = false;
  state.security.pinHash = "";

  saveState();
  renderPage();

  toast("PIN protection disabled.");
}

async function checkPinOnStartup(){
  if(!state.security.pinEnabled){
    return;
  }

  updateProfileUI();

  $("lockScreen").classList.add("show");

  setTimeout(()=>{
    $("unlockPin").focus();
  },100);
}

async function unlockApp(){
  const pin = $("unlockPin").value;

  if(!validPin(pin)){
    $("unlockError").textContent = "Enter your 4-digit PIN.";
    return;
  }

  const hash = await hashPin(pin);

  if(hash !== state.security.pinHash){
    $("unlockError").textContent = "Incorrect PIN.";
    $("unlockPin").value = "";
    return;
  }

  $("unlockError").textContent = "";
  $("unlockPin").value = "";
  $("lockScreen").classList.remove("show");

  toast(`Welcome back, ${state.profile.name || "User"}! 👋`);
}

/* =========================================================
   MODAL HELPERS
   ========================================================= */

function createModal(title,html){
  const modal = document.createElement("div");

  modal.className = "modal show";

  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h2>${escapeHtml(title)}</h2>
        <button class="close">✕</button>
      </div>

      ${html}
    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector(".close").onclick = ()=>{
    modal.remove();
  };

  modal.addEventListener("click",e=>{
    if(e.target===modal){
      modal.remove();
    }
  });

  return modal;
}

/* =========================================================
   SAFE USER PROMPTS
   =========================================================
   Some embedded/sandboxed environments block window.prompt().
   These helpers use a custom modal instead.
   ========================================================= */

function promptSafe(message,defaultValue=""){
  const result = window.prompt(message,defaultValue);
  return result;
}

function confirmSafe(message){
  return window.confirm(message);
}

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      await navigator.storage.persist();
    }
  }catch(error){
    console.warn("Persistent storage request failed:",error);
  }
}

startup();
